name: TowerScout Container Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish, for example v0.1.0-rc1"
        required: true
        type: string
      push_latest:
        description: "Also publish the latest tag"
        required: true
        default: false
        type: boolean
      pytorch_flavor:
        description: "PyTorch wheel flavor to publish"
        required: true
        default: "cpu"
        type: choice
        options:
          - cpu
          - cuda128

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        id: build
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${{ inputs.tag }}"
          push_latest="${{ inputs.push_latest }}"
          pytorch_flavor="${{ inputs.pytorch_flavor }}"

          case "$pytorch_flavor" in
            cpu)
              pytorch_index_url="https://download.pytorch.org/whl/cpu"
              ;;
            cuda128)
              pytorch_index_url="https://download.pytorch.org/whl/cu128"
              ;;
            *)
              echo "Unsupported PyTorch flavor: $pytorch_flavor" >&2
              exit 1
              ;;
          esac

          case "$tag" in
            *-cpu|*-cuda[0-9]*)
              if [[ "$tag" != *-"$pytorch_flavor" ]]; then
                echo "Tag $tag already ends with a different PyTorch flavor than $pytorch_flavor." >&2
                exit 1
              fi
              published_tag="$tag"
              ;;
            *)
              published_tag="$tag-$pytorch_flavor"
              ;;
          esac

          tags=(--tag "$image:$published_tag")
          if [ "$push_latest" = "true" ]; then
            tags+=(--tag "$image:latest-$pytorch_flavor")
          fi

          docker buildx build \
            --platform linux/amd64 \
            --build-arg PYTORCH_INDEX_URL="$pytorch_index_url" \
            --build-arg TOWERSCOUT_PYTORCH_FLAVOR="$pytorch_flavor" \
            --build-arg TOWERSCOUT_TORCH_VERSION="2.10.0" \
            --build-arg TOWERSCOUT_TORCHVISION_VERSION="0.25.0" \
            --build-arg TOWERSCOUT_RELEASE_VERSION="$tag" \
            --build-arg TOWERSCOUT_SOURCE_REF="$GITHUB_SHA" \
            "${tags[@]}" \
            --push \
            --metadata-file image-metadata.json \
            .

          digest="$(python -c 'import json; print(json.load(open("image-metadata.json", encoding="utf-8"))["containerimage.digest"])')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "base_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag=$published_tag" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pytorch_flavor=$pytorch_flavor" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_STEP_SUMMARY"
          echo "base_tag=$tag" >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$published_tag" >> "$GITHUB_STEP_SUMMARY"
          echo "pytorch_flavor=$pytorch_flavor" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$digest" >> "$GITHUB_STEP_SUMMARY"
          echo "pinned=$image@$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: image-metadata-${{ steps.build.outputs.tag }}
          path: image-metadata.json
          if-no-files-found: error

      - name: Scan exact published digest with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: '${{ steps.build.outputs.image }}@${{ steps.build.outputs.digest }}'
          scanners: vuln
          format: json
          output: image-trivy.json
          exit-code: '0'
          ignore-unfixed: 'false'
          version: 'v0.69.3'

      - name: Generate exact-digest CycloneDX SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: '${{ steps.build.outputs.image }}@${{ steps.build.outputs.digest }}'
          format: cyclonedx
          output: image-sbom.cdx.json
          exit-code: '0'
          version: 'v0.69.3'

      - name: Diff exact-digest findings against the accepted baseline
        id: disposition
        shell: bash
        env:
          PINNED_IMAGE: '${{ steps.build.outputs.image }}@${{ steps.build.outputs.digest }}'
        run: |
          set -euo pipefail
          python scripts/task103_trivy_delta.py compare \
            --baseline .github/security/task103-trivy-baseline.v1.json \
            --candidate image-trivy.json \
            --flavor '${{ steps.build.outputs.pytorch_flavor }}' \
            --image "$PINNED_IMAGE" \
            --source-ref "$GITHUB_SHA" \
            --markdown-out image-scan-dispositions.md \
            --json-out image-scan-delta.json
          cat image-scan-dispositions.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact-digest security evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: image-security-${{ steps.build.outputs.tag }}
          path: |
            image-trivy.json
            image-sbom.cdx.json
            image-scan-dispositions.md
            image-scan-delta.json
            .github/security/task103-trivy-baseline.v1.json
          if-no-files-found: error
