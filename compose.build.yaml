services:
  towerscout:
    image: ${TOWERSCOUT_IMAGE:-towerscout:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        TOWERSCOUT_PYTORCH_FLAVOR: ${TOWERSCOUT_PYTORCH_FLAVOR:-cpu}
        TOWERSCOUT_TORCH_VERSION: ${TOWERSCOUT_TORCH_VERSION:-2.6.0}
        TOWERSCOUT_TORCHVISION_VERSION: ${TOWERSCOUT_TORCHVISION_VERSION:-0.21.0}
